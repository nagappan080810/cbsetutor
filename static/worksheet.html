<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worksheet studio · CBSE RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF7EF; --paper-edge:#F1ECDE; --paper-shadow:rgba(43,42,39,.14);
    --ink:#2B2A27; --ink-soft:#6B6862; --ink-faint:#9C978C;
    --rule:#DDD5C2; --panel:#F3EFE4;
    --red:#B23A2E; --red-soft:#F3E3DF; --red-line:#D9BDB6;
    --gold:#9C7A12;
    --c-green:#22c55e; --c-yellow:#eab308; --c-orange:#f97316; --c-red:#ef4444;
    --font-display:'Source Serif 4', Georgia, serif;
    --font-body:'Inter', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#EDE7D8; color:var(--ink); font-family:var(--font-body);
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .topbar{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:22px 32px 14px; max-width:1180px; margin:0 auto;
  }
  .topbar .brand{font-family:var(--font-display); font-size:20px; font-weight:600;}
  .topbar .brand span{color:var(--red);}
  .topbar .sub{font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono);}

  .layout{
    max-width:1180px; margin:0 auto; padding:0 32px 80px;
    display:grid; grid-template-columns:340px 1fr; gap:28px; align-items:start;
  }
  @media (max-width:920px){ .layout{grid-template-columns:1fr;} }

  /* ── control panel ─────────────────────────────────────────── */
  .panel{
    position:sticky; top:20px; background:var(--panel); border:1px solid var(--rule);
    border-radius:10px; padding:22px; display:flex; flex-direction:column; gap:16px;
  }
  .panel h2{font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 2px;}
  .field label{
    display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); margin-bottom:6px; font-weight:500;
  }
  .field select, .field input[type=text], .field input[type=number], .field textarea{
    width:100%; padding:9px 10px; border:1px solid var(--rule); border-radius:6px;
    background:var(--paper); color:var(--ink); font:inherit; font-size:13.5px;
  }
  .field textarea{resize:vertical; min-height:52px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chip-input{
    display:flex; flex-wrap:wrap; gap:6px; padding:7px; border:1px solid var(--rule);
    border-radius:6px; background:var(--paper); min-height:40px;
  }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--red-soft); color:var(--red);
    border-radius:5px; padding:3px 8px; font-size:12.5px; font-weight:500;
  }
  .chip button{background:none; border:none; color:var(--red); cursor:pointer; font-size:13px; line-height:1; padding:0;}
  .chip-input input{border:none; outline:none; background:none; flex:1; min-width:90px; font:inherit; font-size:13px;}

  .check-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .check-pill{
    display:flex; align-items:center; gap:6px; border:1px solid var(--rule); border-radius:20px;
    padding:5px 11px; font-size:12.5px; cursor:pointer; background:var(--paper); user-select:none;
  }
  .check-pill input{accent-color:var(--red);}
  .check-pill.on{border-color:var(--red); background:var(--red-soft); color:var(--red);}

  .generate-btn{
    margin-top:4px; background:var(--ink); color:var(--paper); border:none; border-radius:7px;
    padding:12px; font-family:var(--font-display); font-size:14.5px; font-weight:600;
    cursor:pointer; letter-spacing:.01em;
  }
  .generate-btn:disabled{opacity:.5; cursor:default;}
  .generate-btn:hover:not(:disabled){background:var(--red);}

  .status-line{font-size:12.5px; color:var(--ink-soft); font-family:var(--font-mono); min-height:16px;}
  .status-line.err{color:var(--c-red);}

  /* ── confidence & sources ──────────────────────────────────── */
  .conf-badge{
    display:inline-flex; align-items:center; gap:7px; font-family:var(--font-mono);
    font-size:12.5px; padding:5px 10px; border-radius:5px; border:1px solid var(--rule);
  }
  .conf-dot{width:8px; height:8px; border-radius:50%;}
  .sources{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .source-item{
    font-size:11.5px; color:var(--ink-soft); border-left:2px solid var(--rule);
    padding:3px 0 3px 9px; font-family:var(--font-mono);
  }

  /* ── worksheet paper ───────────────────────────────────────── */
  .sheet-wrap{position:relative;}
  .empty-state{
    border:1px dashed var(--rule); border-radius:10px; padding:70px 30px; text-align:center;
    color:var(--ink-faint); font-family:var(--font-display); font-size:16px;
  }
  .sheet{
    position:relative; background:var(--paper); border-radius:4px;
    box-shadow:0 1px 2px var(--paper-shadow), 0 18px 40px -24px var(--paper-shadow);
    padding:44px 48px 56px; overflow:hidden;
  }
  .sheet::before{ /* torn top edge */
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(115deg, var(--paper-edge) 0 10px, transparent 10px 20px);
  }
  .watermark{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-18deg);
    font-family:var(--font-display); font-size:64px; font-weight:600; color:var(--ink);
    opacity:.035; white-space:nowrap; pointer-events:none; letter-spacing:.04em;
  }
  .sheet-head{border-bottom:2px solid var(--ink); padding-bottom:16px; margin-bottom:22px;}
  .sheet-eyebrow{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .sheet-title{font-family:var(--font-display); font-size:26px; font-weight:600; margin:0 0 4px;}
  .sheet-subtitle{font-size:14px; color:var(--ink-soft); margin:0 0 10px;}
  .sheet-instructions{font-size:12.5px; color:var(--ink-soft); font-style:italic;}

  .section-title{
    font-family:var(--font-display); font-size:15px; font-weight:600; margin:30px 0 14px;
    display:flex; align-items:center; gap:10px;
  }
  .section-title::after{content:""; flex:1; height:1px; background:var(--rule);}

  .qrow{display:grid; grid-template-columns:36px 1fr 84px; gap:14px; padding:16px 0; border-bottom:1px solid var(--rule);}
  .qrow:last-child{border-bottom:none;}
  .qnum{font-family:var(--font-mono); font-size:13px; color:var(--ink-faint); padding-top:2px;}
  .qtext{font-size:14.5px;}
  .qtype-badge{
    display:inline-block; font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft); border:1px solid var(--rule); border-radius:3px;
    padding:1px 6px; margin-left:8px; vertical-align:middle;
  }
  .options{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:5px;}
  .options li{font-size:13.5px; color:var(--ink-soft); padding-left:2px;}

  .answer-block{
    margin-top:10px; background:var(--red-soft); border-left:3px solid var(--red);
    border-radius:0 6px 6px 0; padding:10px 12px; font-size:13px; display:none;
  }
  .answer-block.show{display:block;}
  .answer-block .lbl{font-family:var(--font-mono); font-size:10px; text-transform:uppercase; color:var(--red); letter-spacing:.05em; margin-bottom:3px;}
  .answer-block .exp{color:var(--ink-soft); margin-top:5px;}

  /* margin review widget — the red-pen grading column */
  .review{display:flex; flex-direction:column; align-items:flex-end; gap:6px; padding-top:2px;}
  .mark-btns{display:flex; gap:4px;}
  .mark-btn{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--rule); background:var(--paper);
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .mark-btn svg{width:13px; height:13px; stroke:var(--ink-faint); fill:none; stroke-width:2.4;}
  .mark-btn[data-mark="good"].active{background:#E6F3DE; border-color:var(--c-green);}
  .mark-btn[data-mark="good"].active svg{stroke:#3B6D11;}
  .mark-btn[data-mark="bad"].active{background:var(--red-soft); border-color:var(--red);}
  .mark-btn[data-mark="bad"].active svg{stroke:var(--red);}
  .mark-btn[data-mark="unsure"].active{background:#FAEEDA; border-color:var(--c-orange);}
  .mark-btn[data-mark="unsure"].active svg{stroke:#854F0B;}
  .note-toggle{font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0;}
  .note-box{width:100%; max-width:220px;}
  .note-box textarea{
    display:none; width:100%; margin-top:4px; font-size:11.5px; padding:6px; border:1px solid var(--rule);
    border-radius:5px; font-family:var(--font-body); resize:vertical; min-height:38px;
  }
  .note-box.open textarea{display:block;}

  .sheet-toolbar{
    display:flex; gap:10px; justify-content:flex-end; margin-bottom:14px; flex-wrap:wrap;
  }
  .tool-btn{
    font-family:var(--font-mono); font-size:11.5px; padding:7px 12px; border-radius:6px;
    border:1px solid var(--rule); background:var(--paper); color:var(--ink); cursor:pointer;
  }
  .tool-btn:hover{border-color:var(--ink);}
  .tool-btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .tool-btn.primary:hover{background:var(--red); border-color:var(--red);}

  .eval-summary{
    display:flex; gap:14px; font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);
    padding-top:6px; margin-top:2px; border-top:1px dashed var(--rule);
  }

  @media print{
    body{background:#fff;}
    .panel, .sheet-toolbar, .review, .topbar{display:none !important;}
    .layout{grid-template-columns:1fr; padding:0;}
    .sheet{box-shadow:none;}
    .qrow{grid-template-columns:36px 1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">Worksheet <span>studio</span></div>
  <div class="sub">/api/generate-worksheet · review &amp; export</div>
</div>

<div class="layout">

  <!-- ── control panel ─────────────────────────────────────────── -->
  <form class="panel" id="genForm">
    <h2>Generate</h2>

    <div class="row2">
      <div class="field">
        <label for="classSelect">Class</label>
        <select id="classSelect">
          <option value="class_8">Class 8</option>
          <option value="class_9">Class 9</option>
          <option value="class_10" selected>Class 10</option>
        </select>
      </div>
      <div class="field">
        <label for="subjectSelect">Subject</label>
        <select id="subjectSelect">
          <option value="mathematics">Mathematics</option>
          <option value="science" selected>Science</option>
          <option value="socialscience">Social Science</option>
          <option value="english">English</option>
          <option value="hindi">Hindi</option>
          <option value="kannada">Kannada</option>
          <option value="tamil">Tamil</option>
          <option value="sanskrit">Sanskrit</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="topicInput">Topics</label>
      <div class="chip-input" id="chipInput">
        <input type="text" id="topicInput" placeholder="Type a topic, press Enter">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="difficultySelect">Difficulty</label>
        <select id="difficultySelect">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>
      <div class="field">
        <label for="numQuestions">Questions</label>
        <input type="number" id="numQuestions" value="10" min="3" max="30">
      </div>
    </div>

    <div class="field">
      <label>Question types</label>
      <div class="check-grid" id="qtypeGrid">
        <label class="check-pill on"><input type="checkbox" value="mcq" checked>MCQ</label>
        <label class="check-pill on"><input type="checkbox" value="short" checked>Short</label>
        <label class="check-pill"><input type="checkbox" value="truefalse">True/False</label>
        <label class="check-pill"><input type="checkbox" value="fillblank">Fill blank</label>
        <label class="check-pill"><input type="checkbox" value="long">Long answer</label>
        <label class="check-pill"><input type="checkbox" value="assertreason">Assertion-Reason</label>
      </div>
    </div>

    <div class="field">
      <label for="extraInstr">Extra instructions <span style="text-transform:none;font-weight:400;">(optional)</span></label>
      <textarea id="extraInstr" placeholder="e.g. emphasize numericals, avoid diagram-based questions…"></textarea>
    </div>

    <button type="submit" class="generate-btn" id="genBtn">Generate worksheet</button>
    <div class="status-line" id="statusLine"></div>

    <div id="confWrap" style="display:none;">
      <div class="conf-badge" id="confBadge"><span class="conf-dot"></span><span id="confText"></span></div>
      <div class="sources" id="sourcesList"></div>
    </div>
  </form>

  <!-- ── worksheet output ──────────────────────────────────────── -->
  <div class="sheet-wrap">
    <div class="sheet-toolbar" id="toolbar" style="display:none;">
      <button class="tool-btn" id="toggleAnswersBtn">Show answer key</button>
      <button class="tool-btn" id="exportBtn">Export review (.json)</button>
      <button class="tool-btn" id="printBtn">Print</button>
      <button class="tool-btn primary" id="regenBtn">Regenerate</button>
    </div>
    <div id="sheetContainer">
      <div class="empty-state">Set your parameters and generate a worksheet to review it here.</div>
    </div>
  </div>

</div>

<script>
const chipInputEl = document.getElementById('chipInput');
const topicInput  = document.getElementById('topicInput');
let topics = [];

function renderChips(){
  chipInputEl.querySelectorAll('.chip').forEach(c => c.remove());
  topics.forEach((t, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${escapeHtml(t)} <button type="button" data-i="${i}">&times;</button>`;
    chipInputEl.insertBefore(chip, topicInput);
  });
}
chipInputEl.addEventListener('click', e => {
  if (e.target.matches('.chip button')){
    topics.splice(+e.target.dataset.i, 1);
    renderChips();
  } else {
    topicInput.focus();
  }
});
topicInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && topicInput.value.trim()){
    e.preventDefault();
    topics.push(topicInput.value.trim());
    topicInput.value = '';
    renderChips();
  }
});

document.querySelectorAll('#qtypeGrid .check-pill').forEach(pill => {
  const box = pill.querySelector('input');
  pill.addEventListener('click', e => {
    if (e.target !== box) box.checked = !box.checked;
    pill.classList.toggle('on', box.checked);
  });
});

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function confColor(pct){
  if (pct >= 85) return '#22c55e';
  if (pct >= 60) return '#eab308';
  if (pct >= 40) return '#f97316';
  return '#ef4444';
}

// ── review state: markId -> {mark, note} ─────────────────────────
let reviewState = {};
let currentWorksheet = null;
let currentRequest = null;

const form        = document.getElementById('genForm');
const genBtn       = document.getElementById('genBtn');
const statusLine   = document.getElementById('statusLine');
const confWrap     = document.getElementById('confWrap');
const confBadge    = document.getElementById('confBadge');
const confText     = document.getElementById('confText');
const sourcesList  = document.getElementById('sourcesList');
const sheetContainer = document.getElementById('sheetContainer');
const toolbar      = document.getElementById('toolbar');

form.addEventListener('submit', e => { e.preventDefault(); runGeneration(); });
document.getElementById('regenBtn').addEventListener('click', () => currentRequest && runGeneration(currentRequest));

async function runGeneration(reuseReq){
  const req = reuseReq || {
    class_name: document.getElementById('classSelect').value,
    subject: document.getElementById('subjectSelect').value,
    topics: topics.length ? topics : ['general'],
    difficulty: document.getElementById('difficultySelect').value,
    question_types: [...document.querySelectorAll('#qtypeGrid input:checked')].map(i => i.value),
    num_questions: +document.getElementById('numQuestions').value,
    max_context: 3000,
    extra_instructions: document.getElementById('extraInstr').value.trim(),
  };
  if (!req.question_types.length){
    statusLine.textContent = 'Select at least one question type.';
    statusLine.classList.add('err');
    return;
  }
  currentRequest = req;
  reviewState = {};
  genBtn.disabled = true;
  statusLine.classList.remove('err');
  statusLine.textContent = 'Connecting…';
  confWrap.style.display = 'none';
  toolbar.style.display = 'none';
  sheetContainer.innerHTML = '<div class="empty-state">Generating worksheet…</div>';

  try {
    const res = await fetch('/api/generate-worksheet', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(req),
    });
    if (!res.ok || !res.body) throw new Error(`Server returned ${res.status}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true){
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const chunks = buffer.split('\n\n');
      buffer = chunks.pop();
      for (const chunk of chunks){
        const line = chunk.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        handleEvent(JSON.parse(line.slice(6)));
      }
    }
  } catch (err){
    statusLine.textContent = `Connection error: ${err.message}`;
    statusLine.classList.add('err');
  } finally {
    genBtn.disabled = false;
  }
}

function handleEvent(evt){
  if (evt.type === 'status'){
    statusLine.textContent = evt.message;
  } else if (evt.type === 'confidence'){
    confWrap.style.display = 'block';
    confBadge.querySelector('.conf-dot').style.background = evt.color || confColor(evt.score);
    confText.textContent = `${evt.score}% confidence · ${evt.label}`;
  } else if (evt.type === 'sources'){
    sourcesList.innerHTML = evt.data.slice(0, 6).map(s =>
      `<div class="source-item">${escapeHtml(s.chapter || s.file || '')}${s.section ? ' · ' + escapeHtml(s.section) : ''} (p.${s.page})</div>`
    ).join('');
  } else if (evt.type === 'graph'){
    const n = evt.matched_concepts || 0;
    const note = document.createElement('div');
    note.className = 'source-item';
    note.style.borderLeftColor = n ? '#22c55e' : 'var(--rule)';
    note.textContent = n
      ? `Concept graph: ${n} concept${n === 1 ? '' : 's'} matched`
      : 'Concept graph: no match (vector context only)';
    sourcesList.prepend(note);
  } else if (evt.type === 'progress'){
    statusLine.textContent = 'Writing questions…';
  } else if (evt.type === 'worksheet'){
    currentWorksheet = evt.data;
    renderSheet(evt.data);
    toolbar.style.display = 'flex';
  } else if (evt.type === 'done'){
    statusLine.textContent = evt.message || 'Done.';
  } else if (evt.type === 'error'){
    statusLine.textContent = evt.message;
    statusLine.classList.add('err');
    if (!currentWorksheet) sheetContainer.innerHTML = `<div class="empty-state">${escapeHtml(evt.message)}</div>`;
  }
}

// Fixed CBSE assertion-reason options -- always this exact wording/order,
// so the frontend renders them rather than trusting the model to
// reproduce them verbatim every time (cheaper, and can't drift).
const ASSERT_REASON_OPTIONS = [
  "A. Both A and R are true and R is the correct explanation of A.",
  "B. Both A and R are true but R is NOT the correct explanation of A.",
  "C. A is true but R is false.",
  "D. A is false but R is true.",
];

function renderSheet(ws){
  let qCounter = 0;
  const sectionsHtml = (ws.sections || []).map(section => {
    const rows = (section.questions || []).map(q => {
      qCounter++;
      const mid = `q${qCounter}`;
      let body;
      if (q.type === 'assertreason'){
        body = `<div class="qtext">
          <div><strong>Assertion (A):</strong> ${escapeHtml(q.assertion || '')}</div>
          <div><strong>Reason (R):</strong> ${escapeHtml(q.reason || '')}</div>
          <span class="qtype-badge">${q.type}</span>
        </div>`;
        body += `<ul class="options">${ASSERT_REASON_OPTIONS.map(opt =>
           `<li>${escapeHtml(opt)}</li>`
         ).join('')}</ul>`;
      } else {
        body = `<div class="qtext">${escapeHtml(q.text)}<span class="qtype-badge">${q.type}</span></div>`;
        if (q.type === 'mcq' && Array.isArray(q.options)){
          body += `<ul class="options">${q.options.map(opt =>
             `<li>${escapeHtml(opt)}</li>`
           ).join('')}</ul>`;
        }
      }
      let answerBlock = '';
      if (q.answer){
        answerBlock = `<div class="answer-block" data-answer-block>
          <div class="lbl">Answer</div>${escapeHtml(q.answer)}
          ${q.explanation ? `<div class="exp">${escapeHtml(q.explanation)}</div>` : ''}
        </div>`;
      }
      return `<div class="qrow">
        <div class="qnum">${qCounter}.</div>
        <div>${body}${answerBlock}</div>
        <div class="review" data-mark-id="${mid}">
          <div class="mark-btns">
            <button type="button" class="mark-btn" data-mark="good" title="Good question">
              <svg viewBox="0 0 24 24"><polyline points="4 12 9 18 20 6"/></svg>
            </button>
            <button type="button" class="mark-btn" data-mark="unsure" title="Needs a look">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r="0.6"/></svg>
            </button>
            <button type="button" class="mark-btn" data-mark="bad" title="Flag as wrong">
              <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
            </button>
          </div>
          <button type="button" class="note-toggle">+ note</button>
          <div class="note-box"><textarea placeholder="Why? e.g. distractor is nonsensical, answer key wrong…"></textarea></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="section-title">${escapeHtml(section.sectionTitle || '')}</div>${rows}`;
  }).join('');

  sheetContainer.innerHTML = `<div class="sheet">
    <div class="watermark">REVIEW COPY</div>
    <div class="sheet-head">
      <div class="sheet-eyebrow">Draft worksheet · for teacher review</div>
      <div class="sheet-title">${escapeHtml(ws.title || 'Untitled worksheet')}</div>
      <div class="sheet-subtitle">${escapeHtml(ws.subtitle || '')}</div>
      <div class="sheet-instructions">${escapeHtml(ws.instructions || '')}</div>
    </div>
    ${sectionsHtml}
    <div class="eval-summary" id="evalSummary"></div>
  </div>`;

  wireReviewControls();
}

function wireReviewControls(){
  document.querySelectorAll('[data-mark-id]').forEach(box => {
    const id = box.dataset.markId;
    reviewState[id] = reviewState[id] || { mark: null, note: '' };

    box.querySelectorAll('.mark-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const mark = btn.dataset.mark;
        reviewState[id].mark = reviewState[id].mark === mark ? null : mark;
        box.querySelectorAll('.mark-btn').forEach(b =>
          b.classList.toggle('active', reviewState[id].mark === b.dataset.mark));
        updateEvalSummary();
      });
    });

    const noteToggle = box.querySelector('.note-toggle');
    const noteBox = box.querySelector('.note-box');
    const textarea = noteBox.querySelector('textarea');
    noteToggle.addEventListener('click', () => noteBox.classList.toggle('open'));
    textarea.addEventListener('input', () => { reviewState[id].note = textarea.value; });
  });
  updateEvalSummary();
}

function updateEvalSummary(){
  const marks = Object.values(reviewState);
  const good = marks.filter(m => m.mark === 'good').length;
  const bad = marks.filter(m => m.mark === 'bad').length;
  const unsure = marks.filter(m => m.mark === 'unsure').length;
  const el = document.getElementById('evalSummary');
  if (el) el.textContent = `Reviewed: ${good} good · ${unsure} unsure · ${bad} flagged`;
}

document.getElementById('toggleAnswersBtn').addEventListener('click', function(){
  const showing = this.textContent.startsWith('Hide');
  document.querySelectorAll('[data-answer-block]').forEach(b => b.classList.toggle('show', !showing));
  this.textContent = showing ? 'Show answer key' : 'Hide answer key';
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

document.getElementById('exportBtn').addEventListener('click', () => {
  if (!currentWorksheet) return;
  const payload = {
    generated_at: new Date().toISOString(),
    request: currentRequest,
    worksheet: currentWorksheet,
    review: reviewState,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `worksheet-review-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>

</body>
</html>
